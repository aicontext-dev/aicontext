name: Publish NuGet Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: aicontext-dev

      - name: Pack all projects
        run: |
          dotnet pack src/AIContext/AIContext.csproj -c Release -o ./nupkgs
          dotnet pack src/AIContext.CLI/AIContext.CLI.csproj -c Release -o ./nupkgs
          dotnet pack src/AIContext.Spec/AIContext.Spec.csproj -c Release -o ./nupkgs

      - name: Push to NuGet
        run: |
          for f in ./nupkgs/*.nupkg; do
            dotnet nuget push "$f" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
          done
