name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "SPEC.md"
      - "README.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - "schema/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site artifact
        run: |
          mkdir -p _site/spec
          mkdir -p _site/schema/v1
          cp docs/index.html _site/index.html
          cp docs/spec/index.html _site/spec/index.html
          cp README.md _site/README.md
          cp SPEC.md _site/SPEC.md
          cp GOVERNANCE.md _site/GOVERNANCE.md
          cp CHANGELOG.md _site/CHANGELOG.md
          cp schema/v1/context.schema.json _site/schema/v1/context.schema.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
