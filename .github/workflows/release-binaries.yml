name: Release Binaries

# Builds the standalone (self-contained, single-file) CLI binaries of the commit the calling workflow runs on, smoke-tests
# the exact files and keeps them as artifacts. It publishes nothing: publish.yml attaches the artifacts to the GitHub
# release after every check has passed. See RELEASING.md.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the binaries must report (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest,    archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz }
          - { rid: osx-x64,     os: macos-15-intel,   archive: tar.gz }
          - { rid: osx-arm64,   os: macos-latest,     archive: tar.gz }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Partial trimming only trims framework assemblies; AIContext and JsonSchema.Net
      # (reflection-based) are left intact. Full trimming/AOT is not used for that reason.
      # Invariant globalization removes the libicu dependency on Linux.
      - name: Publish single-file binary
        run: |
          dotnet publish src/AIContext.CLI/AIContext.CLI.csproj \
            -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:InvariantGlobalization=true \
            -p:DebugType=none \
            -o publish

      - name: Stage binary
        run: |
          mkdir -p stage
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv publish/AIContext.CLI.exe stage/aicontext.exe
          else
            mv publish/AIContext.CLI stage/aicontext
            chmod +x stage/aicontext
          fi
          cp LICENSE stage/LICENSE

      - name: Create archive
        run: |
          mkdir -p dist
          name="aicontext-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path stage/* -DestinationPath dist/$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C stage .
          fi

      # The archive is what is distributed, so it is the archive that is unpacked and smoke-tested.
      - name: Smoke test the archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p verify
          name="aicontext-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path dist/$name.zip -DestinationPath verify"
            bin="$PWD/verify/aicontext.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C verify
            bin="$PWD/verify/aicontext"
          fi
          bash .github/scripts/smoke-cli.sh "$bin" "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: aicontext-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
