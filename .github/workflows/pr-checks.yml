name: PR Checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-aicontext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate .aicontext (schema, recommended files, secrets)
        run: dotnet run --project src/AIContext.CLI/AIContext.CLI.csproj -c Release -f net10.0 -- validate --strict

      - name: Check generated exports are up to date
        run: dotnet run --project src/AIContext.CLI/AIContext.CLI.csproj -c Release -f net10.0 -- export --target all --check

  build-dotnet-projects:
    runs-on: ubuntu-latest
    needs: validate-aicontext
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build AIContext projects
        run: |
          dotnet build src/AIContext/AIContext.csproj -c Release
          dotnet build src/AIContext.CLI/AIContext.CLI.csproj -c Release
          dotnet build src/AIContext.Spec/AIContext.Spec.csproj -c Release

  test-dotnet-projects:
    name: test-dotnet-projects (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-dotnet-projects
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            capabilities: file-symlink,directory-symlink,case-sensitive-directory
          - os: windows-latest
            capabilities: file-symlink,directory-symlink,case-sensitive-directory,case-insensitive-directory
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The link and case-sensitivity tests report themselves as skipped when the runner cannot provide what they
      # need. The capabilities listed for the runner are required, so a runner that lacks one fails the job instead
      # of skipping.
      - name: Run AIContext tests
        run: dotnet test tests/AIContext.Tests/AIContext.Tests.csproj -c Release
        env:
          AICONTEXT_REQUIRE_LINK_CAPABILITIES: ${{ matrix.capabilities }}
